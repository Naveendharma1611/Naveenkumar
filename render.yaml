# Render blueprint: Django REST API + PostgreSQL, and the static HTML/CSS/JS frontend.
databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio

services:
  - type: web
    name: portfolio
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com,portfolio.onrender.com,naveenkumar-qelp.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: portfolio-frontend
    runtime: static
    buildCommand: npm --prefix practice-portal ci && npm --prefix practice-portal run build
    staticPublishPath: frontend
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://yijjamxxovaguxfeenuy.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_A_dpT1pxY_BLr6jG4BlTIQ_WkMshgdI
    routes:
      - type: rewrite
        source: /practice/*
        destination: /practice/index.html
