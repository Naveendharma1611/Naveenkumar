{% csrf_token %}
{% if form.non_field_errors %}<div class="alert error">{{ form.non_field_errors|join:" " }}</div>{% endif %}
{% for field in form %}
<label class="field">
  <span>{{ field.label }}</span>
  {{ field }}
  {% if field.errors %}<small class="err">{{ field.errors|join:" " }}</small>{% endif %}
</label>
{% endfor %}
